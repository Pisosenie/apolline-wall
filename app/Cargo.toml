[package]
name = "apolline-wallpapers"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pick, preview and set live wallpapers for apolline-wall"
repository = "https://github.com/Pisosenie/apolline-wall"

[[bin]]
name = "apolline-wallpapers"
path = "src/main.rs"

[dependencies]
apolline-scene = { path = "../../apolline-scene" }
apolline-wall-protocol = { path = "../protocol" }
iced = { version = "0.14", features = ["image", "tokio"] }
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "rt-multi-thread", "process", "sync"] }
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = "3"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
