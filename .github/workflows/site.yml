name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", "CHANGELOG.md", "README.md", "tests/shaders/hills.frag", "app/assets/fonts/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "CHANGELOG.md", "README.md", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZOLA: "0.23.6"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zola
        run: |
          curl -fsSL "https://github.com/getzola/zola/releases/download/v${ZOLA}/zola-v${ZOLA}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin zola
          zola --version
      - name: Fill the site from the repository
        run: python3 site/prepare.py
      - name: Build
        run: zola --root site build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
