name: Packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Plain text, so the errors can be picked out of the log.
env:
  CARGO_TERM_COLOR: never

jobs:
  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        # The oldest Ubuntu supported, so the package runs on any glibc from 2022 on.
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: apolline-wall
      - name: The scene renderer, at the commit the Arch package names
        run: |
          commit=$(sed -n 's/.*apolline-scene\.git#commit=\([0-9a-f]*\).*/\1/p' apolline-wall/packaging/arch/PKGBUILD)
          git clone --quiet https://github.com/Pisosenie/apolline-scene.git
          git -C apolline-scene checkout --quiet "$commit"
      - name: Build dependencies
        run: sudo apt-get update -q && sudo apt-get install -yq libwayland-dev pkg-config libpipewire-0.3-dev libspa-0.2-dev libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apolline-wall
      # Each on its own, and the first errors as annotations, which show without signing in.
      - name: Format
        working-directory: apolline-wall
        run: cargo fmt --all --check
      - name: Lint
        working-directory: apolline-wall
        env:
          CARGO_TERM_COLOR: never
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          [ "$status" -eq 0 ] || { grep -m5 -A6 -E '^(error|warning)' clippy.log || tail -25 clippy.log; } | tr '\n' ' ' | sed 's/^/::error title=clippy::/'
          exit "$status"
      - name: Test
        working-directory: apolline-wall
        env:
          CARGO_TERM_COLOR: never
        run: |
          cargo test --workspace --locked 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          [ "$status" -eq 0 ] || { grep -m5 -A6 -E '^(error|failures:|thread .* panicked)' test.log || tail -25 test.log; } | tr '\n' ' ' | sed 's/^/::error title=test::/'
          exit "$status"
      - name: Debian package
        working-directory: apolline-wall
        run: tools/package-deb.sh
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.runner }}
          path: apolline-wall/target/release/apolline-wall_*.deb
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apolline-wall/target/release/apolline-wall_*.deb
