[package]
name = "apolline-wall"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Wallpapers for the Apolline shell: a layer-shell surface per monitor, drawn with GLES"
repository = "https://github.com/Pisosenie/apolline-wall"

[[bin]]
name = "apolline-wall"
path = "src/main.rs"

[workspace]
members = ["protocol", "app"]

[dependencies]
apolline-scene = { path = "../apolline-scene" }
apolline-wall-protocol = { path = "protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
fast_image_resize = "6"
toml = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
futures-util = "0.3"
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
glutin = { version = "0.32", default-features = false, features = ["egl", "wayland", "x11"] }
glow = "0.16"
raw-window-handle = "0.6"
libc = "0.2"
libloading = "0.8"
x11rb = { version = "0.13", features = ["allow-unsafe-code", "dl-libxcb", "randr"] }
x11-dl = "2"
